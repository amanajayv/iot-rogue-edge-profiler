<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Portal Access</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-900/50 backdrop-blur-md border border-gray-800 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h2 class="text-xl font-bold text-cyan-400 tracking-wide">SOC Portal Access</h2>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Username</label>
                <input type="text" name="username" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-white focus:border-cyan-500 focus:outline-none text-sm" required>
            </div>
            <div class="relative mb-5">
                <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Password</label>
                <input type="password" id="password" name="password" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 pr-10 text-white focus:border-cyan-500 focus:outline-none text-sm" required>
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-7 text-gray-400 hover:text-white cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
            <p id="error-msg" class="text-xs text-red-400 hidden mt-2">Invalid credentials.</p>
            <button type="submit" class="w-full bg-cyan-900 hover:bg-cyan-800 text-cyan-100 border border-cyan-700 font-medium py-2.5 rounded-lg transition text-sm cursor-pointer mt-4">Authenticate</button>
        </form>
    </div>
    
    <!-- Link to external JS -->
    <script src="/static/app.js"></script>
</body>
</html>
